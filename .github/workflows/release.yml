name: Release Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # macOS: crea Stele.app con PyInstaller
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r desktop/requirements.txt

      - name: Build macOS app with PyInstaller
        run: |
          cd desktop
          pyinstaller --name "Stele Desktop" \
            --windowed \
            --onedir \
            --add-data "stele_app:stele_app" \
            --hidden-import stele_app \
            --hidden-import stele_app.web \
            --hidden-import stele_app.api \
            --hidden-import stele_app.db \
            --osx-bundle-identifier org.erasmdif.stele-desktop \
            launcher.py
          
          # Zipa il .app
          cd dist
          zip -qr ../../Stele-macOS.zip "Stele Desktop.app"

      - name: Upload macOS
        uses: softprops/action-gh-release@v1
        with:
          files: Stele-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Windows: crea Stele.exe con PyInstaller
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r desktop/requirements.txt

      - name: Build Windows exe with PyInstaller
        shell: pwsh
        run: |
          cd desktop
          pyinstaller --name "Stele Desktop" `
            --onedir `
            --console `
            --add-data "stele_app;stele_app" `
            --hidden-import stele_app `
            --hidden-import stele_app.web `
            --hidden-import stele_app.api `
            --hidden-import stele_app.db `
            launcher.py
          
          # Zipa la cartella
          cd dist
          Compress-Archive -Path "Stele Desktop" -DestinationPath ..\..\Stele-Windows.zip

      - name: Upload Windows
        uses: softprops/action-gh-release@v1
        with:
          files: Stele-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Linux: crea binario standalone con PyInstaller
  # ============================================================================
  build-linux:
    # PyInstaller bundles remain linked to the glibc available on the build
    # runner.  Build on Ubuntu 22.04 (glibc 2.35) so the archive also runs on
    # Ubuntu 22.04-derived distributions such as current TUXEDO OS releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r desktop/requirements.txt

      - name: Build Linux binary with PyInstaller
        run: |
          cd desktop
          pyinstaller --name "stele-desktop" \
            --onedir \
            --console \
            --add-data "stele_app:stele_app" \
            --hidden-import stele_app \
            --hidden-import stele_app.web \
            --hidden-import stele_app.api \
            --hidden-import stele_app.db \
            launcher.py
          
          # Rinomina la cartella e crea uno script di avvio user-friendly
          cd dist
          mv stele-desktop Stele
          
          # Script di avvio
          cat > Stele/run.sh << 'LAUNCHER'
          #!/usr/bin/env bash
          set -e
          DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$DIR/stele-desktop" "$@"
          LAUNCHER
          chmod +x Stele/run.sh Stele/stele-desktop

          # Fail the workflow immediately if the executable cannot start on
          # the same glibc baseline used for the release.
          Stele/stele-desktop --help >/dev/null
          
          # Desktop entry
          cat > Stele/stele.desktop << 'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Stele Desktop
          Comment=Tools for digital epigraphy
          Exec=bash run.sh
          Icon=document-edit
          Categories=Office;
          DESKTOP
          
          # Compatta
          tar -czf ../../Stele-Linux.tar.gz Stele/

      - name: Upload Linux
        uses: softprops/action-gh-release@v1
        with:
          files: Stele-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
